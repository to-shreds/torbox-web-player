<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; connect-src 'self'; img-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>DOS game</title>
<link rel="stylesheet" href="./dos-player.css?v=release-1.2.2-games.4">
<script type="module" src="./dos-player.js?v=release-1.2.2-games.4"></script>
</head>
<body data-state="loading">
<main>
  <div class="dos-screen"><canvas id="dos-canvas" width="640" height="400" tabindex="0" aria-label="DOS game screen" data-frames="0"></canvas></div>
  <div class="dos-bar"><p id="dos-status" role="status" aria-live="polite">Opening DOS game…</p><div class="dos-actions"><button id="dos-pause" type="button" disabled>Pause</button><button id="dos-restart" type="button">Restart</button><button id="dos-mute" type="button" aria-pressed="false">Mute</button></div></div>
  <p id="dos-audio-status" class="dos-hint" role="status"></p><p id="dos-controls" class="dos-hint"></p>
</main>
</body>
</html>
