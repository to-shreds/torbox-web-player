<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101925">
<meta name="robots" content="noindex">
<title>TorBox Recovery</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1018;color:#eef3f9}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem}
main{width:min(520px,92vw);padding:1.5rem;background:#121c29;border:1px solid #2c3848;border-radius:16px}
h1{margin:.2rem 0 .7rem;font-size:1.55rem}p{color:#b8c9dc;line-height:1.5}
button{min-height:46px;border:1px solid #a7e5df;border-radius:10px;padding:.7rem 1rem;background:#a7e5df;color:#112423;font:inherit;font-weight:650}
</style>
</head>
<body>
<main>
<h1>Recovering TorBox</h1>
<p>Opening a fresh copy of the player and bypassing any stale cached entry page.</p>
<button id="recover-now" type="button">Open fresh player</button>
</main>
<script>
(() => {
  const target = () => new URL('../?recover=' + Date.now(), location.href).href;
  const go = () => location.replace(target());
  document.getElementById('recover-now').addEventListener('click', go);
  setTimeout(go, 60);
})();
</script>
</body>
</html>
