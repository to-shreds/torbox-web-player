name: Browser-key clone CI

on:
  push:
    branches: [browser-key-clone]
    paths-ignore:
      - '.github/workflows/browser-only-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: browser-key-clone
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Temporary live Cinemeta browse check
        run: |
          node --input-type=module -e "for (const u of ['https://v3-cinemeta.strem.io/catalog/movie/top.json','https://v3-cinemeta.strem.io/catalog/movie/top/search=family.json']) { const r=await fetch(u,{redirect:'manual'}); console.log('RAW_CINEMETA',u,r.status,r.headers.get('location')); await r.body?.cancel(); }"
          node --input-type=module -e "import {Catalog} from './lib/catalog.mjs'; const c=new Catalog(); const r=await c.search({type:'movie',q:'family'}); console.log('LIVE_SEARCH',r.metas.length,r.metas[0]?.id,r.metas[0]?.name)"
      - run: npm run check
      - run: npm test
