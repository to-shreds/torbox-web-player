name: Deploy frontends to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
      - '.github/clone-revision'
      - '.github/direct-revision'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main player
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src
      - name: Checkout browser-key clone
        uses: actions/checkout@v6
        with:
          ref: browser-key-clone
          path: clone-src
      - name: Checkout browser-direct experiment
        uses: actions/checkout@v6
        with:
          ref: browser-direct-experiment
          path: direct-src
      - name: Assemble Pages site
        shell: bash
        run: |
          mkdir -p site/key site/direct
          cp -a main-src/public/. site/
          cp -a clone-src/public/. site/key/
          cp -a direct-src/public/. site/direct/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload combined frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
