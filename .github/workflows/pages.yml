name: Deploy restored v1.1 to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production player
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src
      - name: Assemble root and legacy key path from the same source
        shell: bash
        run: |
          mkdir -p site/key
          cp -a main-src/public/. site/
          cp -a main-src/public/. site/key/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload combined frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
