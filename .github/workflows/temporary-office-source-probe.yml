name: Temporary Office source probe
on:
  push:
    branches: [diagnose/office-wrong-source]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Probe public source providers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { SourceLookup, TorznabSourceLookup, StremioSourceLookup, ACTIVE_STREMIO_PROVIDERS } from './lib/source-lookup.mjs';
          const target={type:'series',id:'tt0386676',season:4,episode:1};
          const providers=[
            new SourceLookup({timeoutMs:15000}),
            new TorznabSourceLookup({timeoutMs:15000}),
            ...ACTIVE_STREMIO_PROVIDERS.map(row=>new StremioSourceLookup({...row,timeoutMs:15000}))
          ];
          for(const provider of providers){
            console.log('\n### '+provider.name);
            try{
              const result=await provider.lookup(target);
              console.log('COUNT',result.sources.length);
              for(const s of result.sources.slice(0,50)){
                console.log(JSON.stringify({
                  provider:s.provider,hash:s.hash,title:s.title,filename:s.filename,
                  resolution:s.resolution,container:s.container,videoCodec:s.videoCodec,
                  audioCodecs:s.audioCodecs,size:s.size,seeders:s.seeders
                }));
              }
            }catch(error){
              console.log('ERROR',error.code,error.message);
            }
          }
          NODE
