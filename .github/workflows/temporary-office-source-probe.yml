name: Temporary Office source probe
on:
  push:
    branches: [diagnose/office-wrong-source]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Inspect MediaFusion Torznab identity fields
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const u=new URL('https://mediafusion.elfhosted.com/torznab');
          u.searchParams.set('t','tvsearch');
          u.searchParams.set('imdbid','tt0386676');
          u.searchParams.set('limit','100');
          u.searchParams.set('season','4');
          u.searchParams.set('ep','1');
          const r=await fetch(u,{headers:{Accept:'application/rss+xml, application/xml, text/xml'},redirect:'manual',signal:AbortSignal.timeout(20000)});
          console.log('STATUS',r.status);
          const xml=await r.text();
          const items=xml.match(/<item\b[^>]*>[\s\S]*?<\/item>/gi)||[];
          for(const item of items.slice(0,15)){
            const title=(/<title\b[^>]*>([\s\S]*?)<\/title>/i.exec(item)?.[1]||'').replace(/^<!\[CDATA\[|\]\]>$/g,'').replace(/&amp;/g,'&').trim();
            const attrs={};
            for(const tag of item.match(/<torznab:attr\b[^>]*\/?\s*>/gi)||[]){
              const n=/\bname=["']([^"']+)["']/i.exec(tag)?.[1];
              const v=/\bvalue=["']([^"']*)["']/i.exec(tag)?.[1];
              if(n&&v!==undefined)attrs[n]=v;
            }
            console.log(JSON.stringify({title,attrs}));
          }
          NODE
