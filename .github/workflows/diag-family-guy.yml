name: Diagnostic Family Guy source classification
on:
  push:
    branches: [diag/family-guy-sources]
    paths: ['.github/workflows/diag-family-guy.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - name: Classify real sources with the app's own code
        run: |
          cat > diag.mjs <<'NODE'
          import { MultiSourceLookup } from './lib/source-lookup.mjs';
          import { sourceHints, browserContainerHints } from './public/source-client.js';
          import { sourceAudioConfidence, automaticSourceOrder, sourceLanguagePreference } from './public/discover.js';
          const lookup = new MultiSourceLookup({ timeoutMs: 20000 });
          const episodes = [[3,5],[8,1],[12,1],[16,1],[20,1],[22,1],[5,10],[10,8]];
          const reasons = {};
          for (const [season, episode] of episodes) {
            let result;
            try { result = await lookup.lookup({ type:'series', id:'tt0182576', season, episode }, { complete:true }); }
            catch (e) { console.log(JSON.stringify({ season, episode, error: e.code || e.message })); continue; }
            const rows = result.sources.map((s, i) => ({ ...s, id: String(i), cached: true, ...sourceHints(s) }));
            const order = automaticSourceOrder(rows, 'series', 'auto', 'balanced');
            console.log(`\n=== S${season}E${episode}: ${rows.length} sources, automatic=${order.length}`);
            for (const s of rows) {
              const c = sourceAudioConfidence(s), h = browserContainerHints(s), rank = order.indexOf(s);
              const why = rank >= 0 ? 'ranked' : s.audioRisk ? 'audioRisk' : s.videoRisk ? 'videoRisk' : s.browserUnsupported ? 'container' : sourceLanguagePreference(s) <= 0 ? 'language' : 'duplicateHash';
              const key = `conf${c}:${why}`; reasons[key] = (reasons[key] || 0) + 1;
              console.log([rank >= 0 ? String(rank + 1).padStart(2) : ' -', `conf=${c}`, why.padEnd(13), (h.container||'?').padEnd(4), (s.resolution||'').padEnd(5), `v=${s.videoCodec||''}`, `a=[${(s.audioCodecs||[]).join(',')}]`, `MB=${Math.round((s.size||0)/1e6)}`, `hash=${String(s.hash||'').slice(0,8)}`, `lang=[${(s.languages||[]).join(',')}]`, '|', s.filename || s.title].join(' '));
            }
          }
          console.log('\nREASONS', JSON.stringify(reasons, null, 1));
          NODE
          node diag.mjs > diag-output.txt 2>&1 || true
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git add -f diag-output.txt; git commit -m "diag output [skip ci]"; git push
