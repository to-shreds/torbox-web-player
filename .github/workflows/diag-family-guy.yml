name: Diagnostic Family Guy source classification
on:
  push:
    branches: [diag/family-guy-sources]
    paths: ['.github/workflows/diag-family-guy.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - name: Classify real sources with the app's own code
        run: |
          cat > diag.mjs <<'NODE'
          import { MultiSourceLookup } from './lib/source-lookup.mjs';
          const lookup = new MultiSourceLookup({ timeoutMs: 20000 });
          const out = { capturedAt: new Date().toISOString(), title: 'Family Guy', id: 'tt0182576', episodes: {} };
          for (const [season, episode] of [[8,1],[20,1],[22,1]]) {
            const result = await lookup.lookup({ type:'series', id:'tt0182576', season, episode }, { complete:true });
            out.episodes[`S${season}E${episode}`] = result.sources.map(({ hash, title, filename, resolution, videoCodec, audioCodecs, languages, size, provider, container }) => ({ hash, title, filename, resolution, videoCodec, audioCodecs, languages, size, provider, container }));
          }
          console.log(JSON.stringify(out));
          NODE
          node diag.mjs > diag-output.txt 2>&1 || true
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git add -f diag-output.txt; git commit -m "diag output [skip ci]"; git push
