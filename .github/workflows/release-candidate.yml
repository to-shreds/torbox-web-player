name: Verify TorBox release candidate
on:
  push:
    branches: [release-candidate]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: torbox-release-candidate-v2
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/release-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
      - name: Approve exact tested candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin release-candidate --depth=1
          CURRENT_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$CURRENT_SHA" != "$CANDIDATE_SHA" ]; then
            echo "Candidate advanced to $CURRENT_SHA while this run tested $CANDIDATE_SHA; refusing stale approval."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin "$CANDIDATE_SHA:refs/heads/release-approved"
          echo "RELEASE_APPROVED=$CANDIDATE_SHA"
