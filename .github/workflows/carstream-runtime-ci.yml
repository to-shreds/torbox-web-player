name: CarStream runtime CI
on:
  push:
    branches: [carstream-runtime]
  pull_request:
    branches: [browser-key-clone]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Run all tests and verify repeatable committed-asset delivery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verification"
          node --test --test-reporter=tap test/*.test.mjs > "$RUNNER_TEMP/verification/tests.log" 2>&1 || { cat "$RUNNER_TEMP/verification/tests.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/verification/tests.log"
          revision="$(git rev-parse HEAD)"
          node tools/build-carstream.mjs "$PWD" "$revision" "$RUNNER_TEMP/first"
          node tools/build-carstream.mjs "$PWD" "$revision" "$RUNNER_TEMP/second"
          diff --recursive --brief "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
          cp "$RUNNER_TEMP/first/asset-manifest.json" "$RUNNER_TEMP/verification/"
          echo "$revision" > "$RUNNER_TEMP/verification/REVISION"
          git diff --exit-code
          test ! -d .integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-verification-node-${{ matrix.node }}
          path: ${{ runner.temp }}/verification/
          retention-days: 7
