name: Verify CarStream runtime foundation
on:
  push:
    branches: [carstream-runtime]
    paths: ['.github/workflows/carstream-foundation-import.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply the exact reviewed and locally tested patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = carstream-runtime
          git merge-base --is-ancestor 0b810f493cd19b2210a6bc4525a7c33cb486cfd5 HEAD
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts=sorted(pathlib.Path('.integration').glob('patch-*.b64'))
          assert len(parts)==4
          encoded=''.join(p.read_text().strip() for p in parts)
          assert len(encoded)==30240
          patch=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=256*1024*1024)
          assert len(patch)==88742
          assert hashlib.sha256(patch).hexdigest()=='aa5d0052db96c8ac612758231b8439490a5c78b17dbe58185b02ed8eaa64539d'
          target=pathlib.Path('/tmp/carstream-runtime.patch')
          target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          print('Exact local patch hash verified and applied to the canonical v1.0.0 baseline.')
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test > "$RUNNER_TEMP/runtime-tests.log" 2>&1 || { cat "$RUNNER_TEMP/runtime-tests.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/runtime-tests.log"
          git diff --check
      - name: Commit verified source, remove temporary transport, and build the pinned bundle
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re, shutil
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'runtime-tests.log').read_text()
          counts={key:int(re.search(r'^# '+key+r' (\d+)$',text,re.M)[1]) for key in ['tests','pass','fail','skipped']}
          assert counts=={'tests':269,'pass':263,'fail':0,'skipped':6}, counts
          pathlib.Path('docs/carstream-foundation-verification.json').write_text(json.dumps({'baseline':'0b810f493cd19b2210a6bc4525a7c33cb486cfd5','patch_sha256':'aa5d0052db96c8ac612758231b8439490a5c78b17dbe58185b02ed8eaa64539d','tests':counts,'syntax_check':'passed','node_version':'24','android_gateway_implemented':False,'physical_device_tested':False,'production_deployed':False},indent=2)+'\n')
          shutil.rmtree('.integration')
          PY
          git config user.name 'CarStream development'
          git config user.email 'carstream-development@users.noreply.github.com'
          git add -A
          git commit -m 'Add canonical CarStream runtime, phone-client auth, storage/PIN adapters and deterministic bundle builder'
          git push origin HEAD:carstream-runtime
          revision="$(git rev-parse HEAD)"
          node tools/build-carstream.mjs "$PWD" "$revision" "$RUNNER_TEMP/carstream-web"
          mkdir -p verification
          cp "$RUNNER_TEMP/runtime-tests.log" verification/
          cp docs/carstream-foundation-verification.json verification/
          cp -a "$RUNNER_TEMP/carstream-web" verification/generated-web
          git bundle create "$PWD/verification/canonical-runtime.bundle" HEAD
          echo "$revision" > verification/REVISION
      - uses: actions/upload-artifact@v4
        with:
          name: verified-carstream-runtime
          path: verification/
          if-no-files-found: error
          retention-days: 7
