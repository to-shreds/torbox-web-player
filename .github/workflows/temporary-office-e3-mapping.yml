name: Temporary Office E3 Torrentio probe
on:
  push:
    branches: [diagnose/office-e3-mapping]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Probe Torrentio Office E3
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://torrentio.strem.fun';
          const urls=[
            base+'/sort=qualityseed/stream/series/tt0386676:4:3.json',
            base+'/sort=seeders/stream/series/tt0386676:4:3.json'
          ];
          for(const url of urls){
            console.log('\nURL',url);
            try{
              const r=await fetch(url,{headers:{Accept:'application/json','User-Agent':'Mozilla/5.0'},redirect:'manual',signal:AbortSignal.timeout(25000)});
              console.log('STATUS',r.status,r.headers.get('content-type'));
              const j=await r.json();
              const streams=Array.isArray(j?.streams)?j.streams:[];
              console.log('COUNT',streams.length);
              for(const s of streams.slice(0,100)){
                const filename=s?.behaviorHints?.filename||'';
                const blob=[s?.name,s?.title,filename].filter(Boolean).join(' ');
                if(/\.mp4\b|\.m4v\b|\.webm\b|S04E03|Dunder/i.test(blob)){
                  console.log(JSON.stringify({
                    infoHash:s.infoHash,fileIdx:s.fileIdx,name:s.name,title:s.title,filename,
                    videoSize:s?.behaviorHints?.videoSize
                  }));
                }
              }
            }catch(e){console.log('ERROR',e.name,e.message);}
          }
          NODE
