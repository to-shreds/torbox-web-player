name: Temporary Office E3 TorBox cache probe
on:
  push:
    branches: [diagnose/office-e3-mapping]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Probe TorBox public cache for exact MP4 candidates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const hashes=[
            '2ccca4b8fdaf48f19ed28531971bf91c9d1f2a5c',
            'b298b2ad83576081395c232545fa903e67f93ded',
            'ad5b9c42ec7daa25f47da3fb2837738706b3adaf',
            'e66805bb996d70fb250efe44a9d790371553c2d4',
            'e35b17b01b5a8ffb886f4ce7c0a5abbe0e418274',
            '286f285158bb4ac51412a4e36020f2bfae61c319',
            '2d302dd91cefe563a7edd5c5bbf45ff75978027e'
          ];
          const u=new URL('https://api.torbox.app/v1/api/torrents/checkcached');
          for(const h of hashes)u.searchParams.append('hash',h);
          u.searchParams.set('format','object');u.searchParams.set('list_files','true');
          const r=await fetch(u,{headers:{Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(20000)});
          console.log('STATUS',r.status);
          const j=await r.json();
          console.log(JSON.stringify(j));
          NODE
