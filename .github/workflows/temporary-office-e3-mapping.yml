name: Temporary Office E3 provider probe
on:
  push:
    branches: [diagnose/office-e3-mapping]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Probe additional Stremio providers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { StremioSourceLookup, PUBLIC_STREMIO_PROVIDERS } from './lib/source-lookup.mjs';
          const target={type:'series',id:'tt0386676',season:4,episode:3};
          for(const row of PUBLIC_STREMIO_PROVIDERS.filter(x=>['mediafusion','comet'].includes(x.id))){
            const p=new StremioSourceLookup({...row,timeoutMs:20000});
            console.log('\nPROVIDER',row.name,row.origin);
            try{
              const r=await p.lookup(target);
              console.log('COUNT',r.sources.length);
              for(const s of r.sources.slice(0,80)) console.log(JSON.stringify({hash:s.hash,title:s.title,filename:s.filename,resolution:s.resolution,container:s.container,videoCodec:s.videoCodec,audioCodecs:s.audioCodecs,size:s.size,seeders:s.seeders,browserContainer:s.browserContainer,browserUnsupported:s.browserUnsupported}));
            }catch(e){console.log('ERROR',e.code,e.message);}
          }
          NODE
