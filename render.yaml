services:
  - type: web
    name: torbox-web-player
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: MEDIA_HOST_SUFFIXES
        value: torbox.app,tb-cdn.cx,tb-cdn.io,tb-cdn.pw,tb-cdn.sh,tb-cdn.st,tb-cdn.to,tb-cdn.earth
      - key: TORBOX_VERIFY_ON_START
        value: '0'
      - key: MULTI_SOURCE_LIVE_CHECK
        value: '0'
      - key: SOURCE_PROVIDER
        value: multi
      - key: FRONTEND_ORIGINS
        value: https://to-shreds.github.io
      - key: HOUSEHOLD_PASSWORD_HASH
        sync: false
      - key: TORBOX_API_KEY
        sync: false
# No database, persistent disk, transcoder or arbitrary-URL proxy is provisioned here.
# Playback uses the session-bound /media ticket route. Render streams the original TorBox bytes and does not transcode them.
